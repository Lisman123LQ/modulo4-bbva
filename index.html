<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Módulo 4 · Registro BBVA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#12305c;
    --navy-dark:#0c2244;
    --blue:#1d5fbf;
    --green:#1f8a4c;
    --orange:#e07a1f;
    --red:#c0392b;
    --bg:#eef1f6;
    --card:#ffffff;
    --line:#d7dee8;
    --text:#1c2733;
    --muted:#6b7686;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:linear-gradient(180deg,var(--navy),var(--navy-dark));
    color:#fff;
    padding:16px 18px 14px;
    position:sticky; top:0; z-index:20;
  }
  header .top{display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px;}
  header p{margin:2px 0 0;font-size:12.5px;color:#c7d3e8;}
  .iconbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;border:none;}

  main{padding:14px 14px 110px;max-width:520px;margin:0 auto;}

  .infobar{display:flex;gap:10px;margin:14px 0;}
  .infobar .chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;text-align:center;}
  .infobar .chip .lbl{font-size:10.5px;letter-spacing:.4px;color:var(--muted);font-weight:600;}
  .infobar .chip .val{font-size:18px;font-weight:700;color:var(--navy);margin-top:2px;}
  .infobar .chip.time .val{font-size:13px;font-weight:600;color:var(--text);}

  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;
    border:1px solid var(--line);}
  label{display:block;font-size:14px;font-weight:700;margin-bottom:7px;color:var(--text);}
  label .req{color:var(--red);}
  label .opt{color:var(--muted);font-weight:500;font-size:12.5px;}

  .row{display:flex;gap:8px;}
  input[type=text],input[type=tel],select{
    width:100%;padding:12px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;background:#fbfcfe;color:var(--text);
  }
  input:focus,select:focus{outline:none;border-color:var(--blue);background:#fff;}
  .btn{border:none;border-radius:10px;font-weight:700;font-size:14.5px;padding:12px 14px;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-orange{background:var(--orange);color:#fff;}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn:active{filter:brightness(.93);}
  .btn:disabled{opacity:.55;}

  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .warn{background:#fdecea;color:var(--red);border:1px solid #f5c6c2;border-radius:10px;
    padding:9px 11px;font-size:13px;margin-top:8px;font-weight:600;}
  .ok{background:#eaf6ee;color:var(--green);border:1px solid #c5e6ce;border-radius:10px;
    padding:9px 11px;font-size:13px;margin-top:8px;font-weight:600;}

  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .photobox{border:1.5px dashed var(--line);border-radius:12px;padding:10px 6px;text-align:center;
    background:#fbfcfe;position:relative;overflow:hidden;min-height:118px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .photobox.filled{border-style:solid;border-color:var(--blue);padding:0;}
  .photobox img{width:100%;height:118px;object-fit:cover;display:block;}
  .photobox .cam{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;}
  .photobox .lbl{font-size:11.5px;font-weight:700;line-height:1.2;color:var(--text);}
  .photobox .req{font-size:10px;color:var(--red);font-weight:700;}
  .photobox input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .photobox .remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;
    border:none;border-radius:50%;width:22px;height:22px;font-size:12px;z-index:2;}

  .note{background:#fff8e6;border:1px solid #f2debc;border-radius:10px;padding:10px 12px;
    font-size:12.5px;color:#7a5b17;margin-top:14px;display:flex;gap:8px;}

  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
  .actions .btn{flex-direction:column;padding:12px 6px;font-size:12.5px;gap:4px;}

  .section-title{font-size:14px;font-weight:800;color:var(--navy);margin:22px 2px 10px;
    display:flex;align-items:center;justify-content:space-between;}
  .section-title span.count{font-weight:600;color:var(--muted);font-size:12.5px;}

  .reg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .reg .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .reg .corr{font-weight:800;color:var(--navy);font-size:14px;}
  .reg .cliente{font-size:13.5px;font-weight:700;}
  .reg .meta{font-size:12px;color:var(--muted);margin-top:1px;}
  .reg .thumbs{display:flex;gap:6px;margin-top:8px;}
  .reg .thumbs img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .reg .thumbs .ph{width:52px;height:52px;border-radius:8px;border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;color:#bcc5d2;font-size:11px;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .badge.si{background:#eaf6ee;color:var(--green);}
  .badge.no{background:#fdecea;color:var(--red);}
  .reg .del{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px;}

  footer.bottombar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;}
  footer.bottombar button{background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;}
  footer.bottombar button.active{color:var(--navy);}
  footer.bottombar .ic{font-size:17px;}

  .modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-end;z-index:50;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow:auto;}
  .modal h3{margin:0 0 12px;font-size:16px;}
  .modal img{width:100%;border-radius:10px;margin-top:6px;}
  .modal .close{display:block;width:100%;margin-top:14px;}
</style>
</head>
<body>

<header>
  <div class="top">
    <div>
      <h1>MÓDULO 4</h1>
      <p>Registro BBVA</p>
    </div>
    <button class="iconbtn" onclick="alert('Completa DNI, Número BBVA y la foto del QR. Los demás campos son opcionales. Los registros se guardan solo en este celular; usa Exportar para pasarlos a Excel.')">?</button>
  </div>
</header>

<main>

  <div class="infobar">
    <div class="chip">
      <div class="lbl">CORRELATIVO</div>
      <div class="val" id="correlativo">0001</div>
    </div>
    <div class="chip time">
      <div class="lbl">FECHA</div>
      <div class="val" id="fechaHora">--</div>
    </div>
  </div>

  <div class="card">
    <label>DNI <span class="req">*</span> (Obligatorio)</label>
    <input type="tel" id="dni" maxlength="8" placeholder="Ingrese DNI" inputmode="numeric">
    <div class="hint" id="dniHint">Se busca el cliente automáticamente al completar los 8 dígitos.</div>
    <div id="dniMsg"></div>
  </div>

  <div class="card">
    <label>CLIENTE <span class="opt">(automático / editable)</span></label>
    <input type="text" id="cliente" placeholder="Se mostrará automáticamente">
  </div>

  <div class="card">
    <label>NÚMERO BBVA <span class="req">*</span> (Obligatorio)</label>
    <input type="tel" id="numero" placeholder="Ingrese número BBVA" inputmode="numeric">
    <div id="numeroMsg"></div>
  </div>

  <div class="card">
    <label style="margin-bottom:12px;">Fotos</label>
    <div class="photos">
      <div class="photobox" id="box-qr">
        <div class="cam">📷</div>
        <div class="lbl">FOTO QR<br>BBVA</div>
        <div class="req">Obligatoria</div>
        <input type="file" accept="image/*" capture="environment" id="file-qr">
      </div>
      <div class="photobox" id="box-antes">
        <div class="cam">📷</div>
        <div class="lbl">FOTO<br>ANTES</div>
        <div class="hint" style="margin:0;font-size:10px;">Opcional</div>
        <input type="file" accept="image/*" capture="environment" id="file-antes">
      </div>
      <div class="photobox" id="box-despues">
        <div class="cam">📷</div>
        <div class="lbl">FOTO<br>DESPUÉS</div>
        <div class="hint" style="margin:0;font-size:10px;">Opcional</div>
        <input type="file" accept="image/*" capture="environment" id="file-despues">
      </div>
    </div>
  </div>

  <div class="card">
    <label>SI / NO <span class="opt">(Opcional)</span></label>
    <select id="sino">
      <option value="">Seleccione…</option>
      <option value="SI">SI</option>
      <option value="NO">NO</option>
    </select>
  </div>

  <div class="note">
    ℹ️ <div><b>Importante:</b> el número BBVA no puede repetirse. Verifica antes de guardar.</div>
  </div>

  <div class="actions">
    <button class="btn btn-green" onclick="agregarNuevo()">➕ Agregar<br>nuevo</button>
    <button class="btn btn-blue" onclick="guardarRegistro()">💾 Guardar<br>registro</button>
    <button class="btn btn-orange" onclick="limpiarCampos()">🧹 Limpiar<br>campos</button>
  </div>

  <div class="section-title">
    Registros guardados
    <span class="count" id="regCount">0</span>
  </div>
  <div id="lista"></div>

  <button class="btn btn-outline" style="width:100%;margin-top:6px;" onclick="exportarExcel()">⬇️ Exportar a Excel (.xlsx)</button>

</main>

<footer class="bottombar">
  <button class="active"><span class="ic">🏠</span>INICIO</button>
  <button onclick="document.getElementById('lista').scrollIntoView({behavior:'smooth'})"><span class="ic">📋</span>REGISTROS</button>
  <button onclick="exportarExcel()"><span class="ic">⬇️</span>EXPORTAR</button>
</footer>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <h3 id="modalTitle">Registro</h3>
    <div id="modalBody"></div>
    <button class="btn btn-outline close" onclick="cerrarModal()">Cerrar</button>
  </div>
</div>

<script>
let registros = [];       // {correlativo, dni, cliente, numero, qr, antes, despues, sino, fecha}
let fotos = {qr:null, antes:null, despues:null};
let intentosNumero = 3;

function pad(n){ return String(n).padStart(4,'0'); }

function actualizarFecha(){
  const d = new Date();
  const f = d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const h = d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('fechaHora').textContent = f+' · '+h;
}
actualizarFecha();
setInterval(actualizarFecha,30000);

const STORAGE_KEY = 'bbva_registros_v1';

function cargarRegistros(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    registros = raw ? JSON.parse(raw) : [];
    registros.sort((a,b)=> a.correlativo - b.correlativo);
  }catch(e){ registros = []; }
  siguienteCorrelativo();
  renderLista();
}

function guardarTodo(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
    return true;
  }catch(e){
    alert('No se pudo guardar en este navegador (posiblemente sin espacio o en modo privado). Exporta seguido a Excel para no perder datos.');
    return false;
  }
}

function siguienteCorrelativo(){
  const max = registros.reduce((m,r)=>Math.max(m,r.correlativo),0);
  document.getElementById('correlativo').textContent = pad(max+1);
}

// --- Búsqueda de cliente por DNI (best effort, puede no funcionar por restricciones del entorno) ---
document.getElementById('dni').addEventListener('input', async (e)=>{
  let v = e.target.value.replace(/\D/g,'').slice(0,8);
  e.target.value = v;
  const msg = document.getElementById('dniMsg');
  msg.innerHTML = '';
  if(v.length === 8){
    msg.innerHTML = '<div class="hint">Buscando cliente…</div>';
    try{
      const token = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6IjE5bGlzbWFuQGdtYWlsLmNvbSJ9.Kh-LRjIaxHwqRXbi7vI52LNl692HRorbf9gqDYGM-sw";
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 6000);
      const resp = await fetch(`https://dniruc.apisperu.com/api/v1/dni/${v}?token=${token}`,{signal:ctrl.signal});
      clearTimeout(t);
      const data = await resp.json();
      if(data && (data.nombres || data.nombre_completo)){
        const nombre = data.nombre_completo || `${data.nombres} ${data.apellidoPaterno||''} ${data.apellidoMaterno||''}`.trim();
        document.getElementById('cliente').value = nombre;
        msg.innerHTML = '<div class="ok">Cliente encontrado.</div>';
      } else {
        msg.innerHTML = '<div class="hint">No se encontró el nombre. Complétalo manualmente.</div>';
      }
    }catch(err){
      msg.innerHTML = '<div class="hint">Búsqueda automática no disponible aquí. Escribe el nombre del cliente manualmente.</div>';
    }
  }
});

// --- Validación de número duplicado ---
document.getElementById('numero').addEventListener('input', (e)=>{
  const v = e.target.value.replace(/\D/g,'');
  e.target.value = v;
  const msg = document.getElementById('numeroMsg');
  const dup = registros.some(r=>r.numero === v);
  if(v.length>=6 && dup){
    intentosNumero = Math.max(0, intentosNumero-0); // display only, no consumption on typing
    msg.innerHTML = `<div class="warn">⚠️ Este número ya está registrado. Verifícalo.</div>`;
  } else {
    msg.innerHTML = '';
  }
});

// --- Fotos ---
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 700;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setupPhotoBox(key, boxId, inputId){
  const box = document.getElementById(boxId);
  const input = document.getElementById(inputId);
  input.addEventListener('change', async ()=>{
    if(!input.files || !input.files[0]) return;
    const dataUrl = await resizeImage(input.files[0]);
    fotos[key] = dataUrl;
    renderPhotoBox(key, boxId);
  });
}
function renderPhotoBox(key, boxId){
  const box = document.getElementById(boxId);
  const labelHtml = box.querySelector('.lbl') ? box.querySelector('.lbl').outerHTML : '';
  if(fotos[key]){
    box.classList.add('filled');
    box.innerHTML = `<img src="${fotos[key]}"><button class="remove" onclick="quitarFoto('${key}','${boxId}')">✕</button>`;
  }
}
function quitarFoto(key, boxId){
  fotos[key] = null;
  location.reload_skip = true;
  rebuildPhotoBox(key, boxId);
}
function rebuildPhotoBox(key, boxId){
  const labels = {qr:['FOTO QR<br>BBVA','Obligatoria'], antes:['FOTO<br>ANTES','Opcional'], despues:['FOTO<br>DESPUÉS','Opcional']};
  const [lbl, tag] = labels[key];
  const box = document.getElementById(boxId);
  box.classList.remove('filled');
  const reqClass = tag==='Obligatoria' ? 'req' : 'hint';
  box.innerHTML = `
    <div class="cam">📷</div>
    <div class="lbl">${lbl}</div>
    <div class="${reqClass}" style="${tag!=='Obligatoria'?'margin:0;font-size:10px;':''}">${tag}</div>
    <input type="file" accept="image/*" capture="environment" id="file-${key}">`;
  setupPhotoBox(key, boxId, 'file-'+key);
}
setupPhotoBox('qr','box-qr','file-qr');
setupPhotoBox('antes','box-antes','file-antes');
setupPhotoBox('despues','box-despues','file-despues');

// --- Botones principales ---
function limpiarCampos(){
  document.getElementById('dni').value='';
  document.getElementById('cliente').value='';
  document.getElementById('numero').value='';
  document.getElementById('sino').value='';
  document.getElementById('dniMsg').innerHTML='';
  document.getElementById('numeroMsg').innerHTML='';
  fotos = {qr:null, antes:null, despues:null};
  rebuildPhotoBox('qr','box-qr');
  rebuildPhotoBox('antes','box-antes');
  rebuildPhotoBox('despues','box-despues');
}

function agregarNuevo(){
  // Atajo: si hay datos sin guardar, guarda primero y luego abre uno nuevo
  const dni = document.getElementById('dni').value;
  if(dni || document.getElementById('numero').value || fotos.qr){
    const ok = guardarRegistro();
    if(!ok) return;
  }
  limpiarCampos();
  document.getElementById('dni').focus();
}

function guardarRegistro(){
  const dni = document.getElementById('dni').value.trim();
  const cliente = document.getElementById('cliente').value.trim();
  const numero = document.getElementById('numero').value.trim();
  const sino = document.getElementById('sino').value;

  if(dni.length !== 8){
    alert('El DNI debe tener 8 dígitos.');
    return false;
  }
  if(!numero){
    alert('Ingresa el número BBVA.');
    return false;
  }
  if(registros.some(r=>r.numero===numero)){
    alert('Este número BBVA ya está registrado. No puede repetirse.');
    return false;
  }
  if(!fotos.qr){
    alert('La foto del QR BBVA es obligatoria.');
    return false;
  }

  const correlativo = registros.reduce((m,r)=>Math.max(m,r.correlativo),0) + 1;
  const reg = {
    correlativo, dni, cliente, numero,
    qr: fotos.qr, antes: fotos.antes, despues: fotos.despues,
    sino, fecha: new Date().toISOString()
  };
  registros.push(reg);
  guardarTodo();
  renderLista();
  siguienteCorrelativo();
  limpiarCampos();
  return true;
}

function eliminarRegistro(correlativo){
  if(!confirm('¿Eliminar este registro?')) return;
  registros = registros.filter(r=>r.correlativo!==correlativo);
  guardarTodo();
  renderLista();
  siguienteCorrelativo();
}

function verRegistro(correlativo){
  const r = registros.find(x=>x.correlativo===correlativo);
  if(!r) return;
  document.getElementById('modalTitle').textContent = `#${pad(r.correlativo)} · ${r.cliente||'Sin nombre'}`;
  let html = `<div class="hint">DNI: ${r.dni} · Número: ${r.numero} · ${r.sino||'—'}</div>`;
  html += `<div style="margin-top:10px;font-weight:700;font-size:12.5px;">QR BBVA</div><img src="${r.qr}">`;
  if(r.antes) html += `<div style="margin-top:10px;font-weight:700;font-size:12.5px;">Antes</div><img src="${r.antes}">`;
  if(r.despues) html += `<div style="margin-top:10px;font-weight:700;font-size:12.5px;">Después</div><img src="${r.despues}">`;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function cerrarModal(){ document.getElementById('modalBg').classList.remove('show'); }

function renderLista(){
  const wrap = document.getElementById('lista');
  document.getElementById('regCount').textContent = registros.length;
  if(registros.length===0){
    wrap.innerHTML = '<div class="empty">Aún no hay registros guardados.</div>';
    return;
  }
  wrap.innerHTML = registros.slice().reverse().map(r=>`
    <div class="reg">
      <div class="head">
        <div>
          <div class="corr">#${pad(r.correlativo)} — ${r.cliente || 'Sin nombre'}</div>
          <div class="meta">DNI ${r.dni} · Número ${r.numero}</div>
        </div>
        ${r.sino ? `<span class="badge ${r.sino.toLowerCase()}">${r.sino}</span>` : ''}
      </div>
      <div class="thumbs" onclick="verRegistro(${r.correlativo})">
        <img src="${r.qr}">
        ${r.antes?`<img src="${r.antes}">`:'<div class="ph">ANTES</div>'}
        ${r.despues?`<img src="${r.despues}">`:'<div class="ph">DESP.</div>'}
      </div>
      <button class="del" onclick="eliminarRegistro(${r.correlativo})">Eliminar</button>
    </div>
  `).join('');
}

// --- Exportar a Excel ---
function exportarExcel(){
  if(registros.length===0){ alert('No hay registros para exportar.'); return; }
  const rows = registros.map(r=>({
    CORRELATIVO: pad(r.correlativo),
    CLIENTE: r.cliente,
    DNI: r.dni,
    NUMERO: r.numero,
    'SI/NO': r.sino,
    FECHA: new Date(r.fecha).toLocaleString('es-PE'),
    'FOTO QR BBVA': r.qr ? 'Sí (ver en la app)' : '',
    'FOTO ANTES': r.antes ? 'Sí (ver en la app)' : '',
    'FOTO DESPUÉS': r.despues ? 'Sí (ver en la app)' : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:32},{wch:12},{wch:14},{wch:8},{wch:18},{wch:16},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'MODULO 4');
  XLSX.writeFile(wb, 'MODULO4_BBVA.xlsx');
}

cargarRegistros();
</script>
